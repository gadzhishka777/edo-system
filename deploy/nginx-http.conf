# ============================================================
# nginx для прод-стенда ТОР ЭДО (bare metal) — РЕЖИМ HTTP
#
# Используется, когда сайт нужно отдавать БЕЗ TLS (внутренний контур,
# тестовый стенд, доступ только по локальной сети).
#
# Структура, пути, порт (8005) и IP-ограничение админки — ТЕ ЖЕ, что в
# deploy/nginx.conf. Отличия только в отсутствии TLS и HSTS.
#
# Установка:
#     sudo cp deploy/nginx-snippets/*.conf /etc/nginx/snippets/
#     sudo cp deploy/nginx-http.conf /etc/nginx/sites-available/edo
#     sudo nginx -t && sudo systemctl reload nginx
#
# !!! ЭТО ФАЙЛ САЙТА, А НЕ ГЛАВНЫЙ КОНФИГ NGINX !!!
# НЕ КОПИРОВАТЬ В /etc/nginx/nginx.conf. Здесь нет `events {}` и `http {}`;
# файл должен подключаться из sites-enabled/, иначе nginx потеряет
# sites-enabled, conf.d и modules-enabled (вместе с модулем geoip2).
# ПРОВЕРКА: grep -c worker_processes /etc/nginx/nginx.conf   # 0 — норм
#
# Гео-ограничение (только РФ / BY / KZ) работает и здесь. Ставить строго
# в этом порядке, иначе `nginx -t` упадёт на отсутствующем файле базы:
#     1) sudo apt install libnginx-mod-http-geoip2
#     2) sudo bash deploy/geoip/update_geoip_db.sh
#     3) скопировать конфиг и перезагрузить nginx
# Подробности — deploy/GEO-BLOCK.md.
#
# !!! ЧТО ОБЯЗАТЕЛЬНО ПРОВЕРИТЬ ПЕРЕД ПЕРЕХОДОМ НА HTTP !!!
#  1. HSTS. Заголовок Strict-Transport-Security браузер запоминает на год.
#     Если домен уже открывали по https, браузер будет ПРИНУДИТЕЛЬНО
#     переводить запросы на https и проигнорирует этот конфиг. Снять
#     «привязку»: в браузере chrome://net-internals/#hsts -> Delete domain
#     security policies (у всех пользователей!), либо подождать истечения
#     max-age. В этом файле HSTS отсутствует намеренно.
#  2. Вход через ЕИС (ЕСА). ESA_REDIRECT_URI в backend/.env и адрес,
#     зарегистрированный в ЕИС, должны стать http://<домен>/api/auth/eis/callback.
#     Значения обязаны совпадать ПОСИМВОЛЬНО, иначе ЕИС вернёт ошибку
#     redirect_uri_mismatch. Меняются в двух местах: в кабинете ЕИС и в .env.
#  3. Secure-cookie. backend/app/core/cookies.py ставит флаг Secure только
#     если запрос пришёл по https (учитывается X-Forwarded-Proto, который
#     выставляет nginx). Здесь $scheme = http, поэтому cookie ставятся без
#     Secure и браузер их принимает. Если поставить Secure вручную — логин
#     «сломается»: браузер молча выбросит cookie.
#  4. Смешанный контент. Если снаружи есть https-прокси, который терминирует
#     TLS и ходит на этот nginx по http, — он обязан передавать
#     X-Forwarded-Proto https, иначе сайт будет считать себя http-шным
#     (и HSTS/cookie Secure не появятся).
#
# ПОЧЕМУ ЗАГОЛОВКИ ПРОДУБЛИРОВАНЫ: nginx НЕ наследует add_header уровня server
# в location, где объявлен хотя бы один свой add_header. В HTTPS-конфиге для
# этого используется подключаемый фрагмент nginx-snippets/edo-security-headers.conf;
# здесь он не подходит (содержит HSTS), поэтому заголовки выписаны явно.
# ============================================================


# Гео-ограничение, часть 1 (контекст http) — ОБЯЗАТЕЛЬНО до блоков server{}.
include /etc/nginx/snippets/edo-geo-block.conf;


server {
    listen 80;
    server_name toredo.mroo-snpm.ru www.toredo.mroo-snpm.ru;

    # Скрываем версию nginx в заголовке Server (сам заголовок nginx убрать
    # нельзя без модуля headers-more; server_tokens off — штатное решение).
    server_tokens off;

    # Без TLS редиректить некуда — сайт отдаётся прямо здесь.
    # HSTS НЕ добавляем: он бы «прибил» браузеры к https.

    client_max_body_size 100M;

    # Гео-ограничение, часть 2 — до location'ов (решение на фазе rewrite).
    include /etc/nginx/snippets/edo-geo-block-server.conf;

    root /var/www/edo/frontend/build;
    index index.html;

    # --- Заголовки безопасности (без HSTS, см. п.1 выше) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Language "ru" always;
    # CSP: CRA инлайнит стили (MUI/emotion) -> 'unsafe-inline' только для style;
    # react-pdf (pdfjs) создаёт worker из blob: -> worker-src 'self' blob:;
    # Inter тянется из Google Fonts, воркер pdf.js — с нашего домена.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA: все не-файловые пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируется — после деплоя браузер обязан взять свежую сборку
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # --- Админка: доступ только из доверенной подсети ---
    # То же ограничение, что и в HTTPS-конфиге. Префикс /admin покрывает
    # /admin, /admin/login и любые вложенные пути.
    # ВНИМАНИЕ: /api/admin/* этим блоком НЕ покрывается — только страница.
    location /admin {
        allow 31.41.60.0/24;
        deny all;
        try_files $uri $uri/ /index.html;
    }

    # Хэшированная статика сборки — кэш на год
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
    }

    # Печати организаций — раздаём напрямую с диска, не кэшируем.
    # Путь должен совпадать со settings.STAMPS_DIR (по умолчанию
    # <репозиторий>/frontend/public/stamps/).
    location /stamps/ {
        alias /var/www/edo/frontend/public/stamps/;
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
    }

    # --- Проксирование API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme = http -> бэкенд не ставит Secure на cookie и не отдаёт HSTS.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Страна клиента для GeoBlockMiddleware (вторая линия обороны).
        # proxy_set_header ПЕРЕЗАПИСЫВАЕТ заголовок от клиента — подделать нельзя.
        proxy_set_header X-Geo-Country $geo_country;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        # Скрываем «отпечаток» апстрима
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
    }

    # --- Health check для мониторинга ---
    location = /health {
        proxy_pass http://127.0.0.1:8005/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
