# ============================================================
# nginx для прод-стенда ТОР ЭДО (bare metal) — РЕЖИМ HTTP
#
# Используется, когда сайт нужно отдавать БЕЗ TLS (внутренний контур,
# тестовый стенд, доступ только по локальной сети).
#
# Установка:
#     sudo cp deploy/nginx-http.conf /etc/nginx/sites-available/edo
#     sudo ln -sf /etc/nginx/sites-available/edo /etc/nginx/sites-enabled/edo
#     sudo nginx -t && sudo systemctl reload nginx
#
# !!! ЧТО ОБЯЗАТЕЛЬНО ПРОВЕРИТЬ ПЕРЕД ПЕРЕХОДОМ НА HTTP !!!
#  1. HSTS. Заголовок Strict-Transport-Security браузер запоминает на год.
#     Если домен уже открывали по https, браузер будет ПРИНУДИТЕЛЬНО
#     переводить запросы на https и проигнорирует этот конфиг. Снять
#     «привязку»: в браузере chrome://net-internals/#hsts -> Delete domain
#     security policies (у всех пользователей!), либо подождать истечения
#     max-age. В этом файле HSTS отсутствует намеренно.
#  2. Вход через ЕИС (ЕСА). ESA_REDIRECT_URI в backend/.env и адрес,
#     зарегистрированный в ЕИС, должны стать http://<домен>/api/auth/eis/callback.
#     Значения обязаны совпадать ПОСИМВОЛЬНО, иначе ЕИС вернёт ошибку
#     redirect_uri_mismatch. Меняются в двух местах: в кабинете ЕИС и в .env.
#  3. Secure-cookie. backend/app/core/cookies.py ставит флаг Secure только
#     если запрос пришёл по https (учитывается X-Forwarded-Proto, который
#     выставляет nginx). В этом конфиге проставляется $scheme = http,
#     поэтому cookie ставятся без Secure и браузер их принимает.
#     Если поставить Secure вручную — логин «сломается»: браузер молча
#     выбросит cookie, и пользователь будет возвращаться на страницу входа.
#  4. Смешанный контент. Если снаружи есть https-прокси, который терминирует
#     TLS и ходит на этот nginx по http, — он обязан передавать
#     X-Forwarded-Proto https, иначе сайт будет считать себя http-шным
#     (и HSTS/cookie Secure не появятся). Для этого добавьте в свой внешний
#     прокси: proxy_set_header X-Forwarded-Proto https;
#
# ПОЧЕМУ ЗАГОЛОВКИ ПРОДУБЛИРОВАНЫ: nginx НЕ наследует add_header уровня server
# в location, где объявлен хотя бы один свой add_header.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name toredo.mroo-snpm.ru;

    # Скрываем версию nginx в заголовке Server (сам заголовок nginx убрать
    # нельзя без модуля headers-more; server_tokens off — штатное решение).
    server_tokens off;

    # Без TLS редиректить некуда — сайт отдаётся прямо здесь.
    # HSTS НЕ добавляем: он бы «прибил» браузеры к https.

    client_max_body_size 60m;
    root /var/www/edo/frontend/build;
    index index.html;

    # --- Заголовки безопасности ---
    # Отличия от HTTPS-конфига: нет Strict-Transport-Security (см. п.1 выше),
    # всё остальное идентично.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Language "ru" always;
    # CSP: CRA инлайнит стили (MUI/emotion) -> 'unsafe-inline' только для style;
    # react-pdf (pdfjs) создаёт worker из blob: -> worker-src 'self' blob:.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA: все не-файловые пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируется — после деплоя браузер обязан взять свежую сборку
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Хэшированная статика сборки — кэш на год
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
    }

    # Печати организаций — раздаём напрямую с диска, не кэшируем
    location /stamps/ {
        alias /opt/edo/frontend/public/stamps/;
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
    }

    # --- Проксирование API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme = http -> бэкенд не ставит Secure на cookie и не отдаёт HSTS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Скрываем «отпечаток» апстрима
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
    }
}
