# ============================================================
# Гео-ограничение доступа ТОР ЭДО — ЧАСТЬ 1 (контекст http).
#
# ЗАЧЕМ: сервис должен открываться только из России, Беларуси и Казахстана.
# Всем остальным отдаётся страница «Доступ ограничен»
# (deploy/geoip/geo-blocked.html).
#
# ЭТОТ ФАЙЛ СОДЕРЖИТ ДИРЕКТИВЫ КОНТЕКСТА `http` (geoip2 / map / geo),
# поэтому подключается ОДИН раз в начало файла сайта — ДО блоков `server{}`:
#
#     include /etc/nginx/snippets/edo-geo-block.conf;
#
# Сам запрет живёт во втором фрагменте — edo-geo-block-server.conf,
# он подключается ВНУТРЬ `server{}`.
#
# ------------------------------------------------------------
# ПРЕДВАРИТЕЛЬНЫЕ УСЛОВИЯ (иначе `nginx -t` упадёт!)
# ------------------------------------------------------------
# 1) Модуль GeoIP2:
#        sudo apt install libnginx-mod-http-geoip2
#    (пакет есть в main-репозитории Ubuntu 22.04; после установки
#     модуль подключается автоматически через /etc/nginx/modules-enabled/)
# 2) Файл базы стран:
#        sudo bash deploy/geoip/update_geoip_db.sh
#    Скрипт положит его в /var/lib/nginx-geoip/dbip-country-lite.mmdb
# 3) Только после этого ставить этот конфиг: `geoip2` на несуществующий
#    файл — фатальная ошибка, `nginx -t` не пройдёт и `reload` не состоится
#    (сайт при этом продолжит работать на старом конфиге).
#
# ПОДРОБНАЯ ИНСТРУКЦИЯ: deploy/GEO-BLOCK.md
# ============================================================


# ------------------------------------------------------------
# Страна клиента по его IP.
#
# auto_reload: база обновляется раз в месяц (см. update_geoip_db.sh),
# поэтому nginx должен перечитывать файл сам, без рестарта.
# Запись файла в скрипте атомарная (через mv), поэтому nginx всегда
# видит либо старую целую базу, либо новую целую.
#
# default=XX: если IP в базе не найден, переменная получит это значение.
# Специально берём несуществующий код страны, а не пустую строку —
# так значение видно в логах и его нельзя спутать с «заголовок не пришёл».
# ------------------------------------------------------------
geoip2 /var/lib/nginx-geoip/dbip-country-lite.mmdb {
    auto_reload 1d;
    $geo_country default=XX source=$remote_addr country iso_code;
}


# ------------------------------------------------------------
# Кому РАЗРЕШЕНО.
#
# Список стран: ISO 3166-1 alpha-2, через точку с запятой.
# Чтобы добавить страну — допишите код, например: `AM 1;`
# (Армения). Чтобы запретить страну из списка — удалите строку
# или поставьте `0`.
#
# `default 0` — «страна не определилась (XX) => ЗАПРЕЩАЕМ».
# Если нужно наоборот (неизвестные IP пропускать), поменяйте на `default 1`.
# Это осознанный выбор: непонятный IP для служебной системы безопаснее
# не пустить. Но помните: под `default 0` попадут и IP, которых просто
# нет в бесплатной базе DB-IP Lite — а также ЛЮБОЙ клиент, если база
# окажется устаревшей.
# ------------------------------------------------------------
map $geo_country $geo_allowed {
    default 0;

    RU 1;   # Россия
    BY 1;   # Беларусь
    KZ 1;   # Казахстан

    # AM 1; # ← пример добавления страны
}


# ------------------------------------------------------------
# Доверенные IP — пропускаются ВСЕГДА, независимо от страны.
#
# ЗАЧЕМ: чтобы одним неверным правилом не отрезать себя от собственной
# системы. Сюда попадает всё, что не является «клиентом из интернета»:
#   - localhost   — systemd (ExecStartPost -> /api/health), мониторинг
#                   на самом сервере, curl из консоли;
#   - 31.41.60.0/24 — подсеть, из которой разрешён /admin (см. nginx.conf).
#
# ЕСЛИ У ВАС ЕСТЬ ВНЕШНИЙ МОНИТОРИНГ (UptimeRobot и т.п.) или интеграция
# с чужого сервера — добавьте его IP сюда, иначе он получит 403.
#
# ВНИМАНИЕ: доверенный IP должен быть РЕАЛЬНЫМ адресом клиента.
# Если перед nginx стоит ещё один прокси/CDN, $remote_addr будет его
# адресом — тогда нужен модуль real_ip (set_real_ip_from / real_ip_header).
# ------------------------------------------------------------
geo $geo_trusted {
    default 0;

    127.0.0.1/32    1;
    ::1/128         1;
    31.41.60.0/24   1;
}


# ------------------------------------------------------------
# Пути, которые НЕ блокируем никогда.
#
#   /.well-known/  — ACME-челлендж certbot. Иначе продление сертификата
#                    из-за границы (или через сервис проверки) сломается,
#                    и через 90 дней сайт отдаст просроченный сертификат.
#
#   /geo-fonts/    — шрифт самой страницы-заглушки (deploy/geoip/fonts/).
#                    Заблокированный клиент по определению не может взять
#                    файл с нашего домена, поэтому этот путь — исключение.
#                    Без него «Доступ ограничен» отрисуется системным
#                    шрифтом вместо Lato.
#
#   /geo-blocked.html — сама страница-заглушка. Нужна здесь ОБЯЗАТЕЛЬНО,
#                    и вот почему.
#
# ПОЧЕМУ КАРТА СЧИТАЕТСЯ ПО $uri, А НЕ ПО $request_uri
# ------------------------------------------------------------
# `error_page 403 /geo-blocked.html` — это ВНУТРЕННИЙ редирект: nginx
# подменяет r->uri и прогоняет rewrite-фазу заново. При этом:
#   - $uri         — уже новый, /geo-blocked.html;
#   - $request_uri — по-прежнему исходный, например "/".
# Если карта смотрит на $request_uri, то на повторном проходе условие
# «страна не разрешена» снова истинно, заглушка блокируется сама собой,
# nginx подавляет рекурсию (флаг r->error_page) и отдаёт клиенту своё
# стандартное тело «403 Forbidden» (146 байт) вместо нашей страницы.
# Именно этот баг и случился на проде 29.09.2026.
# Поэтому: карта по $uri + сам /geo-blocked.html в исключениях.
# ------------------------------------------------------------
map $uri $geo_is_exempt {
    default 0;

    ~^/\.well-known/      1;
    ~^/geo-fonts/         1;
    ~^/geo-blocked\.html$ 1;
}
