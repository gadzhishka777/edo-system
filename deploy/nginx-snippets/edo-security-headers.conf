# ============================================================
# Заголовки безопасности ТОР ЭДО — подключаемый фрагмент nginx.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ: nginx НЕ наследует `add_header` из `server{}` в
# `location{}`, где объявлен хотя бы один собственный `add_header`. Раньше
# заголовки были выписаны копипастой в каждом таком location — и при правке
# (например, при снятии `includeSubDomains` из HSTS) легко забыть одно место.
# Теперь источник истины один — этот файл.
#
# КУДА КЛАСТЬ:
#     sudo mkdir -p /etc/nginx/snippets
#     sudo cp deploy/nginx-snippets/edo-security-headers.conf /etc/nginx/snippets/
#
# ПОДКЛЮЧЕНИЕ (см. deploy/nginx.conf):
#     include /etc/nginx/snippets/edo-security-headers.conf;
#     — в `server{}` (HTTPS) и в каждый `location{}`, у которого есть свой
#       `add_header` (в нашем конфиге это `= /index.html`, `/static/`, `/stamps/`).
#
# ВНИМАНИЕ: фрагмент содержит HSTS. Он имеет смысл ТОЛЬКО в HTTPS-сервере,
# поэтому в HTTP-режиме (deploy/nginx-http.conf) этот файл не подключается —
# там заголовки выписаны отдельно, без HSTS.
# ============================================================

# HSTS: браузер запоминает, что домен доступен только по https, на год.
# includeSubDomains — ОСОЗНАННОЕ решение: поддомены тоже обязаны быть на https.
#   ЕСЛИ какой-то поддомен mroo-snpm.ru живёт только по http — уберите
#   `; includeSubDomains` ЗДЕСЬ (одно место, а не пять), иначе он станет
#   недоступен для браузеров, которые уже получили заголовок.
#   Снять «привязку» у себя: chrome://net-internals/#hsts -> Delete domain
#   security policies (делать каждому пользователю!).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Запрет MIME-sniffing: браузер не должен угадывать тип файла.
add_header X-Content-Type-Options "nosniff" always;

# Запрет встраивания сайта во фрейм (защита от clickjacking).
add_header X-Frame-Options "DENY" always;

# Referer не уходит на сторонние домены целиком.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Отключаем неиспользуемые API браузера.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Язык документа (требование доступности, отдаётся и бэкендом на /api/*).
add_header Content-Language "ru" always;

# CSP. Разбор политики:
#   script-src 'self'          — CRA-бандл + наш воркер pdf.js; сторонних CDN нет
#   style-src 'unsafe-inline'  — CRA/MUI(emotion) инлайнят стили, иначе верстка сломается
#   worker-src 'self' blob:    — react-pdf(pdfjs) создаёт worker из blob:
#   fonts.googleapis.com / fonts.gstatic.com
#                              — src/index.css тянет шрифт Inter из Google Fonts.
#                                Уберёте эти хосты из CSP — шрифт перестанет
#                                грузиться и интерфейс «поедет». Правильнее
#                                положить Inter в src/assets рядом с Lato и
#                                выкинуть внешний хост совсем.
#   object-src 'none'          — никаких <object>/<embed>
#   frame-ancestors 'none'     — дубль X-Frame-Options для современных браузеров
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
