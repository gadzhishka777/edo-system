# ============================================================
# Гео-ограничение доступа ТОР ЭДО — ЧАСТЬ 2 (внутри `server{}`).
#
# Подключается в блок `server{}` того сервера, который отдаёт сайт:
#
#     server {
#         ...
#         include /etc/nginx/snippets/edo-geo-block-server.conf;
#         ...
#     }
#
# Требует, чтобы в этом же файле сайта (в контексте `http`) был подключён
# edo-geo-block.conf — он объявляет $geo_allowed / $geo_trusted / $geo_is_exempt.
#
# ПОЧЕМУ НЕ `if` В КАЖДОМ `location`: `if` внутри location — источник
# классических багов nginx. Здесь вся логика собрана в контексте server,
# где `if` + `set` + `return` работают предсказуемо.
#
# ПРО ПОРЯДОК И ПОВТОРНЫЙ ПРОХОД: `error_page` — это ВНУТРЕННИЙ редирект.
# nginx подменяет r->uri и прогоняет rewrite-фазу ЗАНОВО, поэтому
# `return 403` на повторном проходе срабатывает ещё раз. Спасает то, что
# /geo-blocked.html внесён в $geo_is_exempt (см. edo-geo-block.conf).
# Если его оттуда убрать, nginx подавит рекурсию по флагу r->error_page
# и отдаст своё стандартное тело «403 Forbidden» вместо нашей страницы.
# Зацикливания нет: второй раз error_page уже не срабатывает.
# ============================================================

# 1. По умолчанию — не блокируем (значение переопределяется ниже).
set $geo_block 0;

# 2. Страна не из разрешённого списка (в т.ч. «не определилась») — блокируем.
if ($geo_allowed = 0) { set $geo_block 1; }

# 3. Доверенные IP пропускаем всегда — иначе одним правилом можно
#    отрезать от системы самого себя (см. комментарий к $geo_trusted).
if ($geo_trusted = 1) { set $geo_block 0; }

# 4. Служебные пути пропускаем всегда: ACME-челлендж certbot (иначе не
#    продлится сертификат) и /geo-fonts/ — шрифт страницы-заглушки.
if ($geo_is_exempt = 1) { set $geo_block 0; }

# 5. Итоговое решение. `return 403` в контексте server выполняется на фазе
#    rewrite, то есть ДО разбора location и до проксирования в бэкенд:
#    запрещённый клиент не получает ни файлов сборки, ни ответов API.
if ($geo_block = 1) { return 403; }

# Отдаём страницу-заглушку вместо стандартной «403 Forbidden» от nginx.
# Без `=` статус ответа остаётся 403 (корректно для мониторинга и поиска),
# а тело берётся из файла ниже.
#
# ВНИМАНИЕ: путь /geo-blocked.html ОБЯЗАН быть в $geo_is_exempt
# (edo-geo-block.conf). Иначе внутренний редирект попадёт под то же
# geo-правило, заглушка заблокирует сама себя, и клиент получит
# стандартное тело nginx вместо нашей страницы.
error_page 403 /geo-blocked.html;

# Файл лежит в репозитории: deploy/geoip/geo-blocked.html
# Проверить, что путь верный и файл читается пользователем nginx:
#     ls -l /var/www/edo/deploy/geoip/geo-blocked.html
location = /geo-blocked.html {
    root /var/www/edo/deploy/geoip;
    # Заглушку не кэшируем: как только доступ появится, «Обновить» должно
    # открыть настоящий сайт, а не отдать страницу из кэша браузера.
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# Шрифт Lato для страницы-заглушки.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ПУТЬ: страница живёт по адресу /geo-blocked.html, поэтому
# относительные ссылки в ней разрешаются от корня — обычные /fonts/ попали бы
# в сборку фронтенда, а не сюда.
#
# ПОЧЕМУ ПУТЬ В ИСКЛЮЧЕНИЯХ ($geo_is_exempt): файл лежит на нашем домене,
# который для этого клиента как раз и закрыт. Без исключения браузер получил
# бы 403 на шрифт и отрисовал бы страницу системным шрифтом.
#
# ПОЧЕМУ ЯВНЫЙ default_type: в mime.types старых версий nginx типа для woff2
# может не быть, а отдавать шрифт как application/octet-stream рискованно —
# браузер вправе его не применить.
location /geo-fonts/ {
    alias /var/www/edo/deploy/geoip/fonts/;
    types { font/woff2 woff2; }
    default_type font/woff2;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
}
