# ============================================================
# nginx для ТОР ЭДО (продакшен)
# Фронтенд — статика из build/, API и ГОСТ проксируются на бэкенд.
# Положите файл в /etc/nginx/sites-available/edo и сделайте symlink
# в sites-enabled. Сертификаты: certbot --nginx -d <ваш-домен>
# ============================================================

server {
    listen 80;
    server_name edo.ped-id.ru;              # ← замените на ваш домен
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edo.ped-id.ru;              # ← замените на ваш домен

    # --- TLS (пути после certbot) ---
    ssl_certificate     /etc/letsencrypt/live/edo.ped-id.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edo.ped-id.ru/privkey.pem;

    # Загрузка документов до 50 МБ + запас
    client_max_body_size 60m;

    # --- Статика фронтенда ---
    root /var/www/edo/frontend/build;
    index index.html;

    # SPA: все не-API маршруты отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html никогда не кэшируется — иначе после обновления
    # браузеры держат старый бандл и ловят ChunkLoadError (белый экран)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Кэш статики сборки ( CRA кладёт файлы с хэшем в имени )
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Бэкенд API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Штампы обращений/документов (статика бэкенда)
    location /stamps/ {
        proxy_pass http://127.0.0.1:8000/stamps/;
        proxy_set_header Host $host;
    }
}
