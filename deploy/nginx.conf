# /etc/nginx/sites-available/edo.ped-id.ru
# Reverse proxy: HTTPS → frontend (nginx) + backend (FastAPI) + gost

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name edo.ped-id.ru www.edo.ped-id.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edo.ped-id.ru www.edo.ped-id.ru;

    # SSL сертификаты Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/edo.ped-id.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edo.ped-id.ru/privkey.pem;

    # Настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Загрузка файлов до 50 МБ
    client_max_body_size 50M;

    # Frontend — статика из Docker-контейнера frontend (порт 80)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (на случай если понадобится)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты для загрузки больших файлов
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Go GOST — сервис проверки ЭП (только внутренний, не публичный)
    # Раскомментировать если нужен прямой доступ:
    # location /gost/ {
    #     proxy_pass http://127.0.0.1:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Health check
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health;
    }
}
