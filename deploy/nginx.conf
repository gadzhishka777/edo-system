# ============================================================
# nginx для прод-стенда ТОР ЭДО — HTTPS (основной режим)
#
# Собран из ФАКТИЧЕСКОГО прод-конфига от 2026-09-28. СОХРАНЕНО без изменений:
#   - root  /var/www/edo/frontend/build
#   - upstream 127.0.0.1:8005        (НЕ 8000, как в docker-варианте!)
#   - server_name toredo.mroo-snpm.ru + www.toredo.mroo-snpm.ru
#   - /admin и /admin/ — доступ только с 31.41.60.0/24
#   - location = /health -> /api/health
#   - client_max_body_size 100M
#   - сертификаты certbot: options-ssl-nginx.conf + ssl-dhparams.pem
#   - proxy_read_timeout / proxy_send_timeout 300s
#
# ДОБАВЛЕНО в релизе 0.6.1:
#   - security-заголовки, CSP, HSTS          (подключаемый фрагмент)
#   - server_tokens off                      (скрыть версию nginx)
#   - proxy_hide_header Server/X-Powered-By  (скрыть отпечаток uvicorn)
#   - Cache-Control: no-store для index.html (иначе ChunkLoadError после деплоя)
#   - location /stamps/                      (в исходном конфиге ОТСУТСТВОВАЛ)
#
# УСТАНОВКА:
#     sudo mkdir -p /etc/nginx/snippets
#     sudo cp deploy/nginx-snippets/edo-security-headers.conf /etc/nginx/snippets/
#     sudo cp /etc/nginx/sites-available/edo /etc/nginx/sites-available/edo.bak
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/edo
#     sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: у nginx нет «переключателя» режима — конфиг либо https, либо http.
# Для перевода на http используйте deploy/nginx-http.conf.
# ============================================================


# ------------------------------------------------------------
# HTTP :80 — редирект на HTTPS.
# В HTTP-режиме (deploy/nginx-http.conf) этот блок заменяется на отдачу сайта.
# ------------------------------------------------------------
server {
    listen 80;
    server_name toredo.mroo-snpm.ru www.toredo.mroo-snpm.ru;

    server_tokens off;

    # HSTS здесь СОЗНАТЕЛЬНО отсутствует: по http он бессмыслен, а «прилипнув»
    # к браузеру, помешает осознанному переходу на http.
    return 301 https://$host$request_uri;
}


# ------------------------------------------------------------
# Основной HTTPS-сервер
# ------------------------------------------------------------
server {
    # Синтаксис `listen ... http2` работает на ЛЮБОЙ версии nginx.
    # На nginx >= 1.25.1 он даёт предупреждение о устаревании; тогда можно
    # заменить на:
    #     listen 443 ssl;
    #     http2 on;
    listen 443 ssl http2;
    server_name toredo.mroo-snpm.ru www.toredo.mroo-snpm.ru;

    # --- TLS (управляется certbot) ---
    ssl_certificate     /etc/letsencrypt/live/toredo.mroo-snpm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toredo.mroo-snpm.ru/privkey.pem;
    # options-ssl-nginx.conf задаёт ssl_protocols / ssl_ciphers / ssl_session_*.
    # НЕ дублируйте эти директивы ниже — nginx упадёт с «duplicate directive».
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Опционально (ускоряет рукопожатие). Раскомментируйте, если certbot
    # создал chain.pem — проверить: ls /etc/letsencrypt/live/toredo.mroo-snpm.ru/
    # ssl_trusted_certificate /etc/letsencrypt/live/toredo.mroo-snpm.ru/chain.pem;
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # Скрываем версию nginx в заголовке Server (вместо «nginx/1.18.0» -> «nginx»).
    server_tokens off;

    # Security-заголовки уровня сервера. Действуют везде, где в location
    # НЕ объявлен собственный add_header (там фрагмент подключается повторно —
    # nginx не наследует add_header в такие location).
    include /etc/nginx/snippets/edo-security-headers.conf;

    # Ограничение размера загружаемых файлов (как в исходном конфиге).
    client_max_body_size 100M;

    # --- Раздача фронтенд-статики ---
    root /var/www/edo/frontend/build;
    index index.html;

    # SPA: все не-файловые пути отдают index.html (роутинг React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html НЕ кэшируется. После деплоя браузер обязан забрать свежую
    # сборку с новыми хэшами статики — иначе словим ChunkLoadError,
    # потому что старого чанка на диске уже нет.
    location = /index.html {
        include /etc/nginx/snippets/edo-security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # --- Админка: доступ только из доверенной подсети ---
    # Префикс /admin покрывает и /admin, и /admin/login, и /admin/<что угодно>,
    # поэтому отдельный блок `location /admin/` не нужен (в исходном конфиге
    # он был избыточен, но безвреден — при желании можно вернуть).
    #
    # ВНИМАНИЕ: это ограничение защищает только HTML-страницу админки.
    # API админки живёт на /api/admin/* и этим блоком НЕ покрывается —
    # оно защищено лишь логином и cookie-сессией. Если нужно ограничить и API,
    # раскомментируйте блок ниже.
    location /admin {
        allow 31.41.60.0/24;
        deny all;
        try_files $uri $uri/ /index.html;
    }

    # # Строгий вариант: закрыть по IP и админский API тоже.
    # # ВНИМАНИЕ: проверьте, что мониторинг/интеграции не ходят на /api/admin/*.
    # location /api/admin/ {
    #     allow 31.41.60.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8005;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    #     proxy_send_timeout 300s;
    #     client_max_body_size 100M;
    #     proxy_hide_header Server;
    #     proxy_hide_header X-Powered-By;
    #     proxy_hide_header X-AspNet-Version;
    # }

    # --- Хэшированная статика сборки (CRA кладёт файлы с хэшем в имени) ---
    # immutable: файл с таким именем никогда не изменится, повторно не запрашиваем.
    location /static/ {
        include /etc/nginx/snippets/edo-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # --- Печати (штампы) организаций ---
    # ПОЧЕМУ ЭТО НУЖНО: загруженный через админку штамп сохраняется в
    # settings.STAMPS_DIR (по умолчанию <репозиторий>/frontend/public/stamps/)
    # и отдаётся фронтенду по URL /stamps/<файл> — то есть С НАШЕГО домена.
    # В FastAPI маршрута /stamps нет, поэтому без этого блока картинка
    # возвращает 404 и предпросмотр документа остаётся без печати.
    # Штампы, попавшие в сборку на момент `npm run build`, работают и без блока
    # (CRA копирует public/ в build/), но загруженные ПОСЛЕ сборки — нет.
    #
    # ПУТЬ: должен совпадать со settings.STAMPS_DIR. Проверить фактическое значение:
    #     cd /var/www/edo/backend && ./venv/bin/python -c \
    #       "from app.config import settings; print(settings.STAMPS_DIR)"
    location /stamps/ {
        alias /var/www/edo/frontend/public/stamps/;
        include /etc/nginx/snippets/edo-security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # --- Проксирование API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto определяет, ставить ли cookie флаг Secure и отдавать
        # ли HSTS (backend/app/core/cookies.py -> request_scheme()).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        # Скрываем «отпечаток» апстрима: uvicorn/starlette не должны выдавать
        # себя и свою версию через Server / X-Powered-By.
        # (флаг --no-server-header у uvicorn — первая линия, это — вторая)
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
    }

    # --- Health check для мониторинга ---
    # Точное совпадение: снаружи GET /health -> бэкенд GET /api/health.
    location = /health {
        proxy_pass http://127.0.0.1:8005/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
