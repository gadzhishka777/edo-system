# ============================================================
# nginx для прод-стенда ТОР ЭДО (bare metal) — РЕЖИМ HTTPS (основной)
#
# Раздаёт статику из build/, API проксирует на 127.0.0.1:8000.
# Установка:
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/edo
#     sudo ln -s /etc/nginx/sites-available/edo /etc/nginx/sites-enabled/edo
#     sudo nginx -t && sudo systemctl reload nginx
# TLS-сертификаты: sudo certbot --nginx -d toredo.mroo-snpm.ru
#
# ВАЖНО: у nginx нет «переключателя» режима — конфиг либо https, либо http.
# Чтобы перевести сайт на http, используйте deploy/nginx-http.conf
# (см. также deploy/PRODUCTION_CHECKLIST.md, раздел «Переход на http»).
#
# ПОЧЕМУ ЗАГОЛОВКИ ПРОДУБЛИРОВАНЫ: nginx НЕ наследует add_header уровня server
# в location, где объявлен хотя бы один свой add_header. Поэтому в каждом
# location, где есть кэш-заголовки, security-заголовки выписаны заново.
# ============================================================

# ------------------------------------------------------------
# HTTP :80 — редирект на HTTPS.
# В HTTP-режиме (deploy/nginx-http.conf) этот блок заменяется на отдачу сайта.
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name toredo.mroo-snpm.ru;

    server_tokens off;
    # HSTS здесь СОЗНАТЕЛЬНО отсутствует: по http он не имеет смысла,
    # а «прилипнув» к браузеру, помешает осознанному переходу на http.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Директива `http2 on;` появилась в nginx 1.25.1.
    # На более старых сборках (например, nginx 1.18 в Ubuntu 22.04) она
    # вызовет ошибку «unknown directive» — там закомментируйте её и
    # используйте старый синтаксис: `listen 443 ssl http2;` (строки выше).
    http2 on;
    server_name toredo.mroo-snpm.ru;

    # --- TLS (пути после certbot) ---
    ssl_certificate     /etc/letsencrypt/live/toredo.mroo-snpm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toredo.mroo-snpm.ru/privkey.pem;
    # Цепочка промежуточных сертификатов — нужна для OCSP stapling.
    ssl_trusted_certificate /etc/letsencrypt/live/toredo.mroo-snpm.ru/chain.pem;

    # Только TLS 1.2/1.3: 1.0/1.1 признаны небезопасными (RFC 8996).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Выбор шифра оставляем клиенту: современные клиенты выбирают лучше нас,
    # а серверный приоритет ломает TLS 1.3-совместимость при обновлении наборов.
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling ускоряет рукопожатие (сертификат Let's Encrypt это умеет).
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Скрываем версию nginx в заголовке Server
    server_tokens off;

    # HSTS: браузер запоминает, что домен доступен только по https.
    # includeSubDomains — ОСОЗНАННОЕ решение: поддомены тоже обязаны быть на https.
    # Если поддомен живёт только по http — уберите includeSubDomains,
    # иначе он станет недоступен для уже «приученных» браузеров.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ограничение размера загружаемых файлов (документы до 50 МБ + запас)
    client_max_body_size 60m;

    # --- Раздача фронтенд-статики ---
    root /var/www/edo/frontend/build;
    index index.html;

    # Заголовки безопасности уровня сервера (действуют там, где в location
    # не объявлен собственный add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Language "ru" always;
    # CSP: CRA инлайнит стили (MUI/emotion) -> 'unsafe-inline' только для style;
    # react-pdf (pdfjs) создаёт worker из blob: -> worker-src 'self' blob:.
    # fonts.googleapis.com / fonts.gstatic.com разрешены, потому что
    # src/index.css импортирует шрифт Inter из Google Fonts. Если уберёте эти
    # два хоста из CSP, шрифт перестанет грузиться и интерфейс «поедет».
    # (Правильнее — положить Inter в src/assets рядом с Lato и выкинуть
    # внешний хост совсем; см. deploy/UPGRADE-0.6.1.md, раздел «Что дальше».)
    # Воркер pdf.js раздаётся С НАШЕГО ДОМЕНА (frontend/public/pdf.worker.min.js) —
    # поэтому script-src остаётся строгим, без сторонних CDN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA: все не-файловые пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируется: после деплоя браузер обязан забрать свежую
    # сборку с новыми хэшами статики, иначе словим ChunkLoadError (старый чанк удалён).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Хэшированная статика сборки (CRA кладёт файлы с хэшем в имени) — кэш на год.
    # immutable: файл с таким именем никогда не изменится, повторно не запрашиваем.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
    }

    # Печати организаций: файлы загружаются админом ПОСЛЕ сборки в
    # <репозиторий>/frontend/public/stamps/, поэтому раздаём их alias-ом
    # напрямую с диска. Прежний proxy_pass на :8000/stamps/ возвращал 404 —
    # такого маршрута в FastAPI нет.
    # Путь подставьте под фактический каталог чекаута.
    location /stamps/ {
        alias /opt/edo/frontend/public/stamps/;
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
    }

    # --- Проксирование API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto определяет, ставить ли cookie Secure и отдавать ли HSTS
        # (backend/app/core/cookies.py -> request_scheme()).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Скрываем «отпечаток» апстрима: uvicorn/starlette не должны
        # выдавать себя и версию через Server/X-Powered-By.
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
    }
}
