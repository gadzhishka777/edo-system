# ============================================================
# Nginx для контейнера frontend (docker-compose)
# Раздаёт статику SPA, проксирует /api на бэкенд — вся страница
# работает в одном origin, HttpOnly-cookie с SameSite=Lax ходят без проблем.
#
# ВАЖНО про add_header: если в location объявлен свой add_header,
# заголовки уровня server в этом location НЕ наследуются — поэтому
# security-заголовки продублированы в каждом location с кэшированием.
# ============================================================

server {
    listen 80;
    server_name _;

    # Скрываем версию nginx в заголовке Server
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Заголовки безопасности для всех ответов этого server ---
    # CSP: CRA инлайнит стили (MUI/emotion) -> 'unsafe-inline' только для style;
    # react-pdf (pdfjs) создаёт worker из blob: -> worker-src 'self' blob:.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Language "ru" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws: wss:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA routing — все не-файловые пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html не кэшируем: после нового деплоя браузер обязан
        # забрать свежую версию с новыми хэшами статики
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Language "ru" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws: wss:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Печати организаций (загружаются админом после сборки) — не кэшируем
    location /stamps/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Language "ru" always;
    }

    # API: проксируем на бэкенд (same-origin => cookie-сессии работают в Lax-режиме)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
        proxy_read_timeout 120s;

        # Скрываем «отпечаток» апстрима: версии uvicorn/starlette не должны
        # утекать наружу через Server / X-Powered-By.
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
    }

    # Хэшированная статика CRA — кэш на год
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Language "ru" always;
    }
}
